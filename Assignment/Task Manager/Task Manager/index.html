<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Task Manager</h1>

  <!-- Task Form -->
  <form id="task-form">
    <input type="text" id="task-title" placeholder="Task title" required>
    <input type="text" id="task-desc" placeholder="Task description" required>
    <button type="submit">Add Task</button>
  </form>

  <!-- Parent element for event bubbling / delegation -->
  <div id="task-list">
    <!-- Tasks are added here dynamically via JavaScript -->
  </div>

  <hr>

  <!-- Event Propagation Demo -->
  <h2>Event Propagation Demo</h2>
  <p>Click the button inside the boxes below and check the log.</p>

  <div id="outer" class="box">
    Outer div
    <div id="middle" class="box">
      Middle div (stops propagation here)
      <button id="inner-btn">Inner Button (has 2 click listeners)</button>
    </div>
  </div>

  <a href="https://example.com" id="demo-link">This link's default action will be prevented</a>

  <div id="log"></div>

  <script src="script.js"></script>
</body>
</html>
